[package]
name = "paperquant"
version = "0.2.0"
description = "Paper trading platform for algorithmic traders"
edition = "2021"

[lib]
name = "paperquant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
